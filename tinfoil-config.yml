cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "app"
    image: "ghcr.io/myxamediyar/garlic-cvm@sha256:1261892dff8358c8d28d0dfdb43ad92abba936d1ab26edb6947631b544a9edb2"
    secrets:
      - API_KEY
    restart: always
    tmpfs:
      /tmp: "size=512m"
      /root/.cache: "size=256m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20m

shim:
  upstream-port: 8080
  paths:
    - /health
    - /ask
