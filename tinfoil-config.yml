cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "app"
    image: "ghcr.io/myxamediyar/garlic-cvm@sha256:52930285892018e2ea2b627dd87761920e1b6a28ef6f5a8d953271331b139b6e"
    secrets:
      - API_KEY
    restart: always
    tmpfs:
      /tmp: "size=512m"
      /root/.cache: "size=256m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10m

shim:
  upstream-port: 8080
  paths:
    - /health
    - /ask
