cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "app"
    image: "ghcr.io/myxamediyar/garlic-cvm@sha256:ca007ee163c78bcb5704097860e6b36982009c80ceca57a941ffaa7965f271b1"
    secrets:
      - API_KEY
    restart: always
    tmpfs:
      /tmp: "size=512m"
      /root/.cache: "size=256m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20m

shim:
  upstream-port: 8080
  paths:
    - /health
    - /ask
